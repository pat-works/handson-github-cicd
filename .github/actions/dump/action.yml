name: Dump          # アクション名
description: |      # アクションの概要
  環境変数とgithubコンテキストをログへ出力します。
  ワークフローのデバッグに便利です。
inputs:                                       # アクションの入力パラメータ
  enable-context:                               # 入力ID
    default: 'true'                             # デフォルト値
    required: false                             # 必須フラグ
    description: コンテキストをログ出力するか     # 概要
outputs:                                      # アクションの出力値
  dumped-date:                                  # 出力ID
    value: ${{ steps.current.outputs.date }}    # 出力値
    description: ダンプ日時                      # 概要
runs:
  using: composite  # アクションの実装方式
  steps:            # アクションのメインロジック
    # 環境変数を出力する
    - run: printenv | sort
      shell: bash
    # githubコンテキストを出力する
    - run: echo "${CONTEXT}"
      if: ${{ inputs.enable-context == 'true' }}
      env:
        CONTEXT: ${{ toJSON(github) }}
      shell: bash
    # ダンプ日時をGITHUB_OUTPUTに出力する
    - id: current
      run: echo "date=$(date)" >> "${GITHUB_OUTPUT}"
      shell: bash
