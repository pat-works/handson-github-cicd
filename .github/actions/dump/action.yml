name: Dump          # アクション名
description: |      # アクションの概要
  環境変数とgithubコンテキストをログへ出力します。
  ワークフローのデバッグに便利です。
inputs:             # アクションの入力
  enable-context:
    default: 'true'
    required: false
    description: コンテキストをログ出力するか
outputs:            # アクションの出力
  dumped-date:
    value: ${{ steps.current.outputs.date }}
    description: ダンプ日時
runs:
  using: composite  # アクションの実装方式
  steps:            # アクションのメインロジック
    # 環境変数を出力する
    - run: printenv | sort
      shell: bash
    # githubコンテキストを出力する
    - run: echo "${CONTEXT}"
      if: ${{ inputs.enable-context == 'true' }}
      env:
        CONTEXT: ${{ toJSON(github) }}
      shell: bash
    # ダンプ日時をGITHUB_OUTPUTに出力する
    - id: current
      run: echo "date=${date}" >> "${GITHUB_OUTPUT}"
      shell: bash
